[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "contextmax"
version = "0.4.0"
description = "Point it at your folders. Get a map of the code, a map of the documents, and the links between them, built by deterministic scripts, with a skill that lets an AI answer with citations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sev Kiriouchine" }]
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "pypdfium2>=4.30,<6",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20,<2",
    # The C++ reader: pinned, so every PC parses C++ the same way and builds the same map.
    "tree-sitter==0.26.0",
    "tree-sitter-cpp==0.23.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
contextmax = "contextmax.cli:run"
cmx = "contextmax.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/contextmax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
